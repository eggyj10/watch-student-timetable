# XcodeGen manifest. From the project root:
#
#     brew install xcodegen
#     xcodegen generate
#     open Timetable.xcodeproj
#
# Change DEVELOPMENT_TEAM and the bundle identifiers below to your own before
# building. If you would rather not use XcodeGen, README.md has the manual
# Xcode steps, which are only a few minutes longer.

name: Timetable

options:
  bundleIdPrefix: au.com.eddiej
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    # Replace with your 10-character Apple Developer Team ID.
    DEVELOPMENT_TEAM: D74HYLMSWH
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:

  # ---------------------------------------------------------------- iOS app

  Timetable:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    entitlements:
      path: Config/iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.eddiej.timetable
        PRODUCT_NAME: Timetable
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timetable
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Saves answering the export-compliance question on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone only: the watch app pairs with a phone, and it saves supplying
        # iPad screenshots to App Store Connect.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: TimetableWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  # -------------------------------------------------------------- Watch app

  TimetableWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    entitlements:
      path: Config/Watch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.eddiej.timetable.watchkitapp
        PRODUCT_NAME: Timetable
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timetable
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: au.com.eddiej.timetable
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The watch keeps its own copy of the timetable, so it must be allowed
        # to run with the phone out of range.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
    dependencies:
      - target: TimetableWidget
        embed: true
        copy:
          destination: plugins

  # ------------------------------------------------------- Widget extension

  TimetableWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Config/Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.eddiej.timetable.watchkitapp.widget
        PRODUCT_NAME: TimetableWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-Info.plist
        SKIP_INSTALL: YES

  # ------------------------------------------------------------------ Tests
  # A standalone logic bundle: it compiles Shared directly rather than hosting
  # the app, so the bell rules can be tested without a simulator boot.

  TimetableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.eddiej.timetable.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:

  Timetable:
    build:
      targets:
        Timetable: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TimetableTests

  TimetableWatch:
    build:
      targets:
        TimetableWatch: all
    run:
      config: Debug
